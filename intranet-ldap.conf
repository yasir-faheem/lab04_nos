# LDAP-protected location for the lab intranet
# Replace <SERVER_IP> with your LDAP server's IP if different from the Apache host.

<Location "/intranet">
    AuthType Basic
    AuthName "Restricted Intranet"
    AuthBasicProvider ldap

    # Search users under ou=Students; map username to 'uid'
    AuthLDAPURL "ldap://<SERVER_IP>/ou=Students,dc=cudlab,dc=local?uid"

    # Bind as LDAP admin to perform lookups (lab setting)
    AuthLDAPBindDN "cn=admin,dc=cudlab,dc=local"
    AuthLDAPBindPassword "ubuntu"

    # Authorize only users in posixGroup 'net121' via memberUid
    AuthLDAPGroupAttribute memberUid
    AuthLDAPGroupAttributeIsDN off

    Require ldap-group cn=net121,ou=Groups,dc=cudlab,dc=local
</Location>
